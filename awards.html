<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수상 &amp; 자격증 — 양정훈</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">양정훈</a>
    <nav class="nav-links">
      <a href="about.html">자기소개</a>
      <div class="has-dropdown">
        <a href="project.html">프로젝트 <span class="caret"></span></a>
        <div class="dropdown">
          <a href="project.html?cat=school">학교 프로젝트</a>
          <a href="project.html?cat=personal">개인 프로젝트</a>
          <a href="project.html?cat=lab">연구실 프로젝트</a>
        </div>
      </div>
      <a href="skill.html">기술 스택</a>
      <a href="awards.html">수상 &amp; 자격증</a>
      <a href="contact.html">연락처</a>
    </nav>
    <div class="nav-right">
      <button class="theme-toggle" aria-label="다크모드 전환"></button>
      <button class="menu-btn" aria-label="메뉴 열기">☰</button>
    </div>
  </div>
</header>

<main>
  <section class="page-head wrap">
    <div class="eyebrow reveal">Awards &amp; Certificates</div>
    <h1 class="reveal">수상 &amp; 자격증</h1>
    <p class="reveal" style="max-width:none;white-space:nowrap;">수상 내역, 자격증·수료, 논문·연구실적을 한 곳에 모았습니다. 최신순으로 정렬됩니다.</p>
  </section>

  <section class="wrap">
    <div class="tabs reveal">
      <button class="tab active" data-cat="all">전체</button>
      <button class="tab" data-cat="awards">수상 내역</button>
      <button class="tab" data-cat="certificates">자격증 &amp; 수료</button>
      <button class="tab" data-cat="papers">논문 &amp; 연구실적</button>
    </div>
    <div id="awardsList"></div>
  </section>
</main>

<footer>
  <div class="wrap footer-inner">
    <span class="fname">양정훈</span>
    <p>© 2026 Jeonghun Yang. All rights reserved.</p>
  </div>
</footer>

<script src="js/main.js"></script>
<script>
let data = {};
const catLabel = {awards:'수상 내역', certificates:'자격증 & 수료', papers:'논문 & 연구실적'};

function render(cat){
  const el = document.getElementById('awardsList');
  const cats = cat === 'all' ? ['awards','certificates','papers'] : [cat];
  let html = '';
  cats.forEach(c=>{
    const items = data[c] || [];
    if(!items.length) return;
    html += `<h3 style="font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:40px 0 4px;">${catLabel[c]}</h3>`;
    items.forEach(a=>{
      html += `
        <div class="award-row reveal">
          <div>
            <h4>${a.title}${a.date==='준비중'?'<span class="status-pill">준비중</span>':''}</h4>
            <p class="org">${a.org}</p>
            <p class="desc">${a.desc}</p>
          </div>
          <div class="date">${a.date}</div>
        </div>`;
    });
  });
  el.innerHTML = html || '<p style="color:var(--ink-soft);">아직 등록된 항목이 없습니다.</p>';
  initReveal();
}

fetch('data/awards.json').then(r=>r.json()).then(d=>{
  data = d;
  render('all');
});

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    render(tab.dataset.cat);
  });
});
</script>
</body>
</html>
